<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/base.css"><script>try{var t=localStorage.getItem("fc-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script><title>Dashboard · FashionCAD Studio</title><script>window.addEventListener("error",function(e){if(document.getElementById("fc-err"))return;var d=document.createElement("div");d.id="fc-err";d.style.cssText="background:#b3261e;color:#fff;padding:.6rem 1rem;text-align:center;font:600 14px sans-serif";d.textContent="A script failed to run: "+(e.message||"unknown error")+". If you just edited firebase/firebase-config.js, check it carefully, then refresh with Ctrl+F5.";function a(){document.body.prepend(d)}document.body?a():document.addEventListener("DOMContentLoaded",a)});</script></head><body>
<div class="dash"><aside class="side" id="side"></aside>
<main class="main"><h1 style="font-size:2.4rem" id="hi">Your studio</h1><p style="color:var(--dim)" id="sub"></p>
<h2 style="margin-top:2rem">New project</h2>
<form class="newp" id="np"><div><label for="pn">Project name</label><input id="pn" maxlength="60" placeholder="Kurta for Diwali collection" required></div>
<div><label for="pg">Garment</label><select id="pg"><option>T-Shirt</option><option>Shirt</option><option>Kurta</option><option>Blouse</option><option>Dress</option><option>Trousers</option><option>Jacket</option><option>Other</option></select></div>
<button class="btn" type="submit">Create</button></form>
<div id="msg" class="msg" hidden role="alert" style="max-width:760px"></div>
<h2 style="margin-top:2rem">Your projects</h2><p class="hint">Open a project to draft its pattern.</p>
<ul class="plist" id="pl"></ul></main></div>
<script type="module">
import {requireAuth,showMsg} from "./js/auth.js";import {renderShell} from "./js/shell.js";
import {loadProfile,listProjects,createProject,renameProject,removeProject} from "./js/account.js";
renderShell("dashboard.html");
requireAuth(async u=>{
 const msg=document.getElementById("msg"),pl=document.getElementById("pl");
 try{const cat=(await (await fetch("data/garments.json")).json()).garments,sel=document.getElementById("pg"),fams={};sel.textContent="";cat.forEach(g=>(fams[g.family]=fams[g.family]||[]).push(g));
  Object.keys(fams).forEach(f=>{const og=document.createElement("optgroup");og.label=f;fams[f].forEach(g=>{const o=document.createElement("option");o.textContent=g.name;og.append(o)});sel.append(og)});
  const o=document.createElement("option");o.textContent="Other";sel.append(o);sel.value="T-Shirt"}catch(e){}
 try{const p=await loadProfile(u.uid);const n=p.name||u.displayName||"";
  document.getElementById("hi").textContent=n?"Welcome, "+n.split(" ")[0]:"Your studio";
  if(p.settings){try{localStorage.setItem("fc-units",p.settings.units||"cm")}catch(e){}}}catch(e){}
 document.getElementById("sub").textContent="Your projects are saved in this browser. Download a backup in Settings to keep a copy.";
 async function draw(){
  pl.textContent="";let items=[];
  try{items=await listProjects(u.uid)}catch(e){showMsg(msg,"Couldn't load projects. Check your Firestore rules and connection.");return}
  if(!items.length){const li=document.createElement("li");li.textContent="No projects yet. Create your first one above.";pl.append(li);return}
  items.forEach(p=>{const li=document.createElement("li");
   const t=document.createElement("div");const b=document.createElement("strong");b.textContent=p.name;
   const s=document.createElement("small");s.textContent=" "+(p.garmentType||"");t.append(b,document.createElement("br"),s);
   const a=document.createElement("div");a.className="acts";
   const o=document.createElement("button");o.className="mini";o.textContent="Open";o.onclick=()=>{location.href="editor.html?id="+encodeURIComponent(p.id)};
   const r=document.createElement("button");r.className="mini";r.textContent="Rename";
   r.onclick=async()=>{const n=prompt("New project name",p.name);if(n&&n.trim()){try{await renameProject(u.uid,p.id,n.trim().slice(0,60));draw()}catch(e){showMsg(msg,"Couldn't rename the project.")}}};
   const d=document.createElement("button");d.className="mini";d.textContent="Delete";
   d.onclick=async()=>{if(confirm("Delete \""+p.name+"\"? This can't be undone.")){try{await removeProject(u.uid,p.id);draw()}catch(e){showMsg(msg,"Couldn't delete the project.")}}};
   const t3=document.createElement("button");t3.className="mini";t3.textContent="3D";t3.onclick=()=>{location.href="studio.html?id="+encodeURIComponent(p.id)};const tp=document.createElement("button");tp.className="mini";tp.textContent="Tech pack";tp.onclick=()=>{location.href="production.html?id="+encodeURIComponent(p.id)};a.append(o,t3,tp,r,d);li.append(t,a);pl.append(li)})}
 document.getElementById("np").addEventListener("submit",async e=>{e.preventDefault();
  const n=document.getElementById("pn").value.trim();if(!n)return;showMsg(msg,"");
  try{await createProject(u.uid,n.slice(0,60),document.getElementById("pg").value);document.getElementById("pn").value="";draw()}
  catch(err){showMsg(msg,"Couldn't create the project. Check your Firestore rules.")}});
 draw();});
</script></body></html>
